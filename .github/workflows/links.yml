name: links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: check the source catalog
        id: check
        shell: bash
        run: bun run check:links | tee report.md
      - name: report dead links
        if: failure() && steps.check.conclusion == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Dead links in the source catalog
        run: |
          body=$(printf '%s\n\n%s\n' "$(cat report.md)" "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
