name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run build:web
      - run: bun test
        env:
          LOG_LEVEL: error

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: junctio:ci
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64
      - name: start the gateway
        run: |
          docker run -d --name junctio \
            --read-only --tmpfs /tmp \
            -e JUNCTIO_SECRET=$(openssl rand -hex 32) \
            -p 3000:3000 junctio:ci
      - name: wait for the health endpoint
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs junctio
          exit 1
      - name: the admin ui is served with hardening headers
        run: |
          headers=$(curl -fsS -D - -o /dev/null http://localhost:3000/)
          echo "$headers" | grep -iq 'content-security-policy' || { echo "$headers"; exit 1; }
          echo "$headers" | grep -iq 'x-frame-options: DENY' || { echo "$headers"; exit 1; }
      - name: the package runtimes work on a read-only root
        run: |
          docker exec junctio uvx --from cowsay cowsay -t ok
          docker exec junctio sh -c 'cd "$TMPDIR" && echo requests > r.in && uv pip compile --universal --python-version 3.12 r.in'
          docker exec junctio sh -c 'cd "$TMPDIR" && bunx --bun cowsay ok'
      - name: stop the gateway
        if: always()
        run: docker rm -f junctio || true
